<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Duel Prototype</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>🌍 Country Duel</h1>
      <p>Head-to-head country picks for you and your partner.</p>
    <p class="hint">Tip: This file is designed to run by double-clicking <code>index.html</code>.</p>
    </header>

    <section class="controls">
      <label for="playerSelect">Voting as:</label>
      <select id="playerSelect"></select>
      <button id="nextPairBtn" class="secondary">Skip Pair</button>
    </section>

    <section id="battle" class="battle"></section>

    <section class="actions">
      <button id="tieBtn" class="tie">🤝 Hard to choose (Tie)</button>
    </section>

    <section class="leaderboard">
      <h2>Leaderboard</h2>
      <div class="tabs">
        <button data-view="combined" class="tab active">Combined</button>
        <button data-view="you" class="tab">You</button>
        <button data-view="partner" class="tab">Partner</button>
      </div>
      <ol id="rankingList"></ol>
    </section>
  </main>
</body>
</html>
